name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify app
        run: |
          npm run typecheck
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK file
        id: apk
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then VERSION="${{ github.ref_name }}"; else VERSION="v1.0.0"; fi
          APK_NAME="todo-focus-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -lh "$APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-focus-apk
          path: ${{ steps.apk.outputs.apk_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: Todo Focus ${{ steps.apk.outputs.version }}
          body: |
            Todo Focus for Android.

            Download the APK below and install it on your Android phone. You may need to allow installation from your browser or file manager when Android asks.

            This APK is built automatically from the Expo / React Native source in this repository.
          files: ${{ steps.apk.outputs.apk_name }}
